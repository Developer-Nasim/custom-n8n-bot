         <div class="chatBar"> 
            <div class="chatBody">  
                <div class="chatInput forModal">
                    <textarea placeholder="Let the magic begin, Ask a question"></textarea>
                    <span></span>
                    <button type="button"><img src="assets/img/image.png" alt=""></button>
                </div>
            </div>
         </div>




         <div class="overlay"></div>
         <div class="modal">
            <div class="modalHeader"> 
                <div class="closeModal forModal"> <span></span> Go Back</div>
            </div>
            <div class="modalBody">
                <div class="modal_chatBody"> 
                    <div class="messagelists">
                        <div class="message">
                            <div class="agentImg">
                                <img src="assets/img/agt.png" alt="">
                            </div> 
                            <div class="resp">

                            </div>
                        </div>

                        <textarea placeholder="Ask anything"></textarea>
                        <span></span>
                        <button type="button"><img src="assets/img/image.png" alt=""></button>
                    </div>
                </div>
            </div>
         </div>


 <script>
    window.onload = function() { 
        const modal = document.querySelector('.modal');
        const overlay = document.querySelector('.overlay');
        const closeModal = document.querySelectorAll('.forModal');  

        if (closeModal.length > 0) {
            closeModal.forEach(Btn => {
                Btn.addEventListener('click', function() {
                    showHideModal()
                });
            }) 
        }

        function showHideModal() {
            modal.classList.toggle('show');
            overlay.classList.toggle('show');
            
        }
    }
 </script>
